<style>
  /* ---- Design tokens (only those referenced below) ---- */
  :root {
    --pa-primary: rgb(25,118,210);
    --pa-primary-700: rgb(17,71,161);
    --pa-primary-04a: rgba(25,118,210,0.04);
    --pa-primary-12a: rgba(25,118,210,0.12);
    --pa-ink: rgb(33,33,33);
    --pa-ink-2: rgb(66,66,66);
    --pa-ink-7: rgb(158,158,158);
    --pa-line-2: rgb(224,224,224);
    --pa-radius-sm: 4px;
    --pa-radius-pill: 16px;
    --pa-font-sans: "Roboto", system-ui, sans-serif;
    --pa-font-display: "Roboto Flex", "Roboto", system-ui, sans-serif;
    --pa-elev-1: 0 1px 3px 0 rgba(0,0,0,0.10), 0 1px 2px -1px rgba(0,0,0,0.10);
    --pa-elev-2: 0 1px 5px 0 rgba(0,0,0,0.12), 0 2px 2px 0 rgba(0,0,0,0.14), 0 3px 1px -2px rgba(0,0,0,0.20);
    --pa-elev-modal: 0 9px 46px 8px rgba(0,0,0,0.12), 0 24px 38px 3px rgba(0,0,0,0.14), 0 11px 15px -7px rgba(0,0,0,0.20);
  }

  html, body { height: 100%; }
  body { margin: 0; background: #fff; font-family: var(--pa-font-sans); }
  a { color: #1976D2; } a:hover { color: #1147A1; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 6px; }

  /* ---- Icon helper ---- */
  .mi { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  /* ---- Buttons (from PrimeAdmin 3 _components.css) ---- */
  .pa-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 32px; padding: 0 16px; border-radius: var(--pa-radius-pill); border: none;
    font-family: var(--pa-font-sans); font-weight: 500; font-size: 12px; line-height: 100%;
    letter-spacing: 0; text-transform: uppercase; cursor: pointer; user-select: none;
    position: relative; isolation: isolate;
    transition: background 150ms cubic-bezier(.4,0,.2,1), box-shadow 150ms cubic-bezier(.4,0,.2,1);
  }
  .pa-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: transparent; pointer-events: none; z-index: 1; }
  .pa-btn > * { position: relative; z-index: 2; }
  .pa-btn--sm { height: 24px; padding: 0 12px; font-size: 10.8px; }
  .pa-btn--primary { background: var(--pa-primary); color: #fff; box-shadow: var(--pa-elev-2); }
  .pa-btn--primary:hover::after  { background: rgba(255,255,255,0.08); }
  .pa-btn--primary:active::after { background: rgba(0,0,0,0.24); }
  .pa-btn--primary[disabled]     { opacity: 0.3; pointer-events: none; box-shadow: none; }
  .pa-btn--secondary-grey { background: #fff; color: var(--pa-ink-2); border: 1px solid var(--pa-ink-7); }
  .pa-btn--secondary-grey:hover::after  { background: rgba(33,33,33,0.04); }
  .pa-btn--secondary-grey:active::after { background: rgba(33,33,33,0.24); }
  .pa-btn--tertiary-grey { background: transparent; color: var(--pa-ink-2); }
  .pa-btn--tertiary-grey:hover::after  { background: rgba(33,33,33,0.04); }
  .pa-btn--tertiary-grey:active::after { background: rgba(33,33,33,0.24); }

  /* ---- Chips ---- */
  .pa-chip {
    display: inline-flex; align-items: center; justify-content: center;
    height: 28px; padding: 0 12px; border-radius: 14px;
    font-family: var(--pa-font-display); font-weight: 700; font-size: 10.8px; line-height: 16.2px;
    letter-spacing: 0; text-transform: uppercase;
    background: var(--pa-line-2); color: var(--pa-ink); user-select: none;
  }
  .pa-chip--selected { background: var(--pa-primary-12a); color: var(--pa-primary); }

  /* ---- Icon buttons (edit / delete on cards) ---- */
  .icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; color: #666; transition: background 120ms, color 120ms; }
  .icon-btn:hover { background: rgba(0,0,0,.05); }
  .icon-btn--danger:hover { background: rgba(211,47,47,.08); color: #d32f2f; }

  /* ---- Hover states that were inline style-hover in source ---- */
  .type-row:hover { background: rgba(25,118,210,.05); }
  .suggest-item:hover { background: #eef5fc; }
</style>
</head>

  var TYPES = [
    { key: 'advisory',   label: 'Advisory Board or Panel',                              short: 'Advisory Board' },
    { key: 'consultant', label: 'Consultant',                                           short: 'Consultant' },
    { key: 'grants',     label: 'Grants / Research Support',                            short: 'Grants / Research' },

  ];
  var COMPANIES = ['AN2 Therapeutics','AbbVie','Ajax','Amgen','AstraZeneca','Blueprint Medicines','Bristol-Myers Squibb','Celgene','CTI BioPharma','DISC Medicine','Genentech','Geron','Gilead','GlaxoSmithKline','Incyte','Italfarmaco Spa','Johnson & Johnson','Karyopharm','Kartos Therapeutics','Merck','MorphoSys','Novartis','Pfizer','PharmaEssentia','Regeneron','Roche','Sanofi','Sierra Oncology','SOBI','Sumitomo','Takeda','Vertex'];

  var ORD = {}; TYPES.forEach(function (t, i) { ORD[t.key] = i; });
  function shortLabel(k) { var t = TYPES.filter(function (x) { return x.key === k; })[0]; return t ? t.short : k; }

  function buildFaculty() {
    var BMS = 'Bristol-Myers Squibb';
    var seed = [
      { name:'John O Mascarenhas, MD', role:'Speaker', initials:'JM', color:'#1976D2', updated:'Mar 19, 2026 at 10:35 PM',
        cats:{ advisory:[BMS,'Geron','Incyte','Italfarmaco Spa','Novartis','SOBI','Sumitomo'],
               consultant:['Blueprint Medicines',BMS,'DISC Medicine','Geron','GlaxoSmithKline','Incyte','Novartis','Pfizer','PharmaEssentia','Roche','SOBI','Sumitomo'],
               grants:['Ajax',BMS,'Geron','Incyte','Italfarmaco Spa','Novartis','PharmaEssentia','SOBI'] } },
      { name:'Aaron Gerds, MD', role:'', initials:'AG', color:'#6A1B9A', updated:'May 13, 2026 at 08:09 AM',
        cats:{ consultant:['AN2 Therapeutics',BMS,'Geron','GlaxoSmithKline','Incyte','Merck','Novartis','PharmaEssentia','Takeda','Vertex'] } },
      { name:'Carolyn Oxencis, PharmD, BCOP, FHOPA', role:'', initials:'CO', color:'#00838F', updated:'', cats:{} },
      { name:'Richa Bhattarai, MD', role:'Planner', initials:'RB', color:'#AD1457', updated:'', cats:{} },
      { name:'Stephanie Joyce, PA, MSPAS, MS, RD', role:'Peer Reviewer', initials:'SJ', color:'#2E7D32', updated:'', cats:{} },
      { name:'Kristi Kay Orbaugh, RN, MSN, RNP, AOCN', role:'Planner', initials:'KO', color:'#5D4037', updated:'', cats:{} }
    ];
    return seed.map(function (f, i) {
      var map = {};
      Object.keys(f.cats).forEach(function (k) {
        f.cats[k].forEach(function (c) {
          if (!map[c]) map[c] = { company: c, types: [], otherText: '' };
          if (map[c].types.indexOf(k) === -1) map[c].types.push(k);
        });
      });
      var disclosures = Object.keys(map).map(function (c) { return map[c]; })
        .sort(function (a, b) { return a.company.localeCompare(b.company); })
        .map(function (d, j) { return { id: 'f' + i + 'd' + j, company: d.company, types: d.types, otherText: d.otherText }; });
      return { id: 'f' + i, name: f.name, role: f.role, initials: f.initials, color: f.color, updated: f.updated, nd: false, disclosures: disclosures };
    });
  }

  // ---------- State ----------
  var state = { faculty: buildFaculty(), open: null, editor: null, confirmDel: null, nid: 1 };

  // ---------- Helpers ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ic(name, size, color, extra) {
    return '<svg class="mi" style="width:' + size + 'px;height:' + size + 'px;fill:' + (color || 'currentColor') + ';' + (extra || '') + '"><use href="#i-' + name + '"></use></svg>';
  }
  function byId(id) { return state.faculty.filter(function (f) { return f.id === id; })[0]; }
  function nowStamp() {
    var d = new Date();
    var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var h = d.getHours(); var ap = h >= 12 ? 'PM' : 'AM'; h = (h % 12) || 12;
    var mm = String(d.getMinutes()).padStart(2, '0');
    return mo + ' ' + d.getDate() + ', ' + d.getFullYear() + ' at ' + h + ':' + mm + ' ' + ap;
  }
  function suggest(q) {
    var s = (q || '').trim().toLowerCase();
    if (s.length < 3) return []; // only autocomplete once 3+ chars typed
    var list = COMPANIES.filter(function (c) { return c.toLowerCase().indexOf(s) !== -1; });
    if (COMPANIES.some(function (c) { return c.toLowerCase() === s; })) list = [];
    return list.slice(0, 6);
  }
  function editorInvalid() {
    var ed = state.editor;
    if (!ed) return true;
    return !(ed.company.trim() && ed.types.length > 0 && (ed.types.indexOf('other') === -1 || ed.otherText.trim()));
  }

  // ---------- Actions ----------
  function toggleNd(id) {
    var f = byId(id);
    if (!f) return;
    if (!f.nd && f.disclosures.length > 0) return; // guard: can't mark ND with relationships present
    f.nd = !f.nd;
    f.updated = nowStamp();
    if (state.editor && state.editor.facultyId === id) state.editor = null;
    render();
  }
  function openEditor(facultyId, discId) {
    var f = byId(facultyId);
    if (!f || f.nd) return;
    var company = '', types = [], otherText = '';
    if (discId) {
      var d = f.disclosures.filter(function (x) { return x.id === discId; })[0];
      if (d) { company = d.company; types = d.types.slice(); otherText = d.otherText; }
    }
    state.editor = { facultyId: facultyId, discId: discId || null, company: company, types: types, otherText: otherText, showSuggest: false };
    state.confirmDel = null;
    render();
  }
  function editorToggle(k) {
    var t = state.editor.types;
    var i = t.indexOf(k);
    if (i === -1) t.push(k); else t.splice(i, 1);
    render();
  }
  function saveEditor() {
    var ed = state.editor;
    if (!ed || editorInvalid()) return;
    var f = byId(ed.facultyId);
    var clean = {
      company: ed.company.trim(),
      types: ed.types.slice(),
      otherText: ed.types.indexOf('other') !== -1 ? ed.otherText.trim() : ''
    };
    if (ed.discId) {
      f.disclosures = f.disclosures.map(function (d) {
        return d.id === ed.discId ? { id: d.id, company: clean.company, types: clean.types, otherText: clean.otherText } : d;
      });
    } else {
      f.disclosures.push({ id: 'n' + (state.nid++), company: clean.company, types: clean.types, otherText: clean.otherText });
    }
    f.disclosures.sort(function (a, b) { return a.company.localeCompare(b.company); });
    f.nd = false;
    f.updated = nowStamp();
    state.editor = null;
    render();
  }
  function confirmDelete() {
    var del = state.confirmDel;
    if (!del) return;
    var f = byId(del.facultyId);
    f.disclosures = f.disclosures.filter(function (d) { return d.id !== del.discId; });
    f.updated = nowStamp();
    state.confirmDel = null;
    render();
  }

  // ---------- Rendering ----------
  function cardHtml(f, d) {
    var confirming = state.confirmDel && state.confirmDel.facultyId === f.id && state.confirmDel.discId === d.id;
    if (confirming) {
      return '<div style="border:1px solid #f0c4c4;border-radius:8px;padding:14px 16px;background:#fdeded">' +
        '<div style="font-size:13px;color:#212121;line-height:19px">Remove <strong>' + esc(d.company) + '</strong> and all of its relationships?</div>' +
        '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">' +
          '<button data-action="cancel-del" class="pa-btn pa-btn--tertiary-grey pa-btn--sm">Cancel</button>' +
          '<button data-action="do-del" class="pa-btn pa-btn--sm" style="background:#d32f2f;color:#fff;box-shadow:var(--pa-elev-2)">Delete</button>' +
        '</div></div>';
    }
    var types = d.types.slice().sort(function (a, b) { return ORD[a] - ORD[b]; }).map(shortLabel);
    var hasOther = d.types.indexOf('other') !== -1 && d.otherText;
    return '<div style="border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:13px 15px">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">' +
        '<div style="font-size:14px;font-weight:600;color:#212121">' + esc(d.company) + '</div>' +
        '<div style="display:flex;gap:4px;flex-shrink:0">' +
          '<span class="icon-btn" data-action="edit-card" data-fid="' + f.id + '" data-did="' + d.id + '">' + ic('pencil-outline', 17, 'currentColor') + '</span>' +
          '<span class="icon-btn icon-btn--danger" data-action="del-card" data-fid="' + f.id + '" data-did="' + d.id + '">' + ic('trash-can-outline', 17, 'currentColor') + '</span>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">' +
        types.map(function (t) { return '<span class="pa-chip pa-chip--selected" style="height:23px;padding:0 9px;font-size:10px">' + esc(t) + '</span>'; }).join('') +
      '</div>' +
      (hasOther ? '<div style="margin-top:10px;font-size:11px;color:#666;line-height:15px;background:#f7f7f7;border-radius:4px;padding:7px 9px"><span style="color:#e98f28;font-weight:600">Other: </span>' + esc(d.otherText) + '</div>' : '') +
    '</div>';
  }

  function editorHtml() {
    var ed = state.editor;
    var title = ed.discId ? 'Edit financial relationship' : 'Add a financial relationship';
    var saveLabel = ed.discId ? 'Save changes' : 'Add';
    var otherVisible = ed.types.indexOf('other') !== -1;
    var typesHtml = TYPES.map(function (t) {
      var on = ed.types.indexOf(t.key) !== -1;
      return '<div class="type-row" data-action="editor-type" data-key="' + t.key + '" style="display:flex;align-items:center;gap:10px;padding:7px 6px;cursor:pointer;border-radius:4px">' +
        ic(on ? 'checkbox-marked' : 'checkbox-blank-outline', 21, on ? '#1976D2' : '#9e9e9e') +
        '<span style="font-size:13px;color:#212121">' + esc(t.label) + '</span></div>';
    }).join('');
    return '<div style="border:1px solid #1976D2;border-radius:8px;padding:18px 20px;background:#f6fafe;margin-bottom:14px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
        '<div style="font-family:\'Inter\',sans-serif;font-size:15px;font-weight:600;color:#1147A1">' + title + '</div>' +
        '<span data-action="close-editor" style="cursor:pointer;color:#666;display:inline-flex">' + ic('close', 20, 'currentColor') + '</span>' +
      '</div>' +
      '<div style="position:relative;margin-bottom:18px;max-width:520px">' +
        '<div style="font-size:13px;letter-spacing:.03em;color:#666;margin-bottom:4px">Company / Organization</div>' +
        '<input id="ed-company" value="' + esc(ed.company) + '" placeholder="Search for [Company]" autocomplete="off" style="width:100%;border:none;border-bottom:1px solid #9e9e9e;background:transparent;padding:6px 0;font-size:14px;color:#212121;outline:none" />' +
        '<div id="ed-suggest"></div>' +
      '</div>' +
      '<div style="font-size:13px;color:#212121;font-weight:500;margin-bottom:8px">Select all relationships that apply.</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 24px">' + typesHtml + '</div>' +
      (otherVisible ? '<div style="margin-top:14px;padding-top:14px;border-top:1px solid #e3edf7"><div style="font-size:13px;color:#666;margin-bottom:5px">Please specify the type of financial relationship you hold with the ineligible company(ies)</div><textarea id="ed-other" style="width:100%;min-height:70px;border:1px solid #9e9e9e;border-radius:4px;padding:8px;font-size:13px;font-family:inherit;color:#212121;outline:none;resize:vertical;background:#fff">' + esc(ed.otherText) + '</textarea></div>' : '') +
      '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">' +
        '<button data-action="close-editor" class="pa-btn pa-btn--secondary-grey pa-btn--sm">Cancel</button>' +
        '<button id="ed-save" data-action="save-editor" class="pa-btn pa-btn--primary pa-btn--sm"' + (editorInvalid() ? ' disabled' : '') + '>' + saveLabel + '</button>' +
      '</div>' +
    '</div>';
  }

  function rowBodyHtml(f) {
    var ndDisabled = f.disclosures.length > 0;
    var editorHere = state.editor && state.editor.facultyId === f.id;
    var addOpen = editorHere && !state.editor.discId;
    var addDisabled = f.nd || addOpen;
    var ndIcon = f.nd ? 'checkbox-marked' : 'checkbox-blank-outline';
    var ndIconColor = f.nd ? '#1976D2' : (ndDisabled ? '#cfcfcf' : '#9e9e9e');
    var ndColor = ndDisabled ? '#bdbdbd' : '#424242';
    var ndCursor = ndDisabled ? 'not-allowed' : 'pointer';
    var ndTitle = ndDisabled ? 'Remove all financial relationships before marking nothing to disclose' : '';

    var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
      '<div ' + (ndDisabled ? '' : 'data-action="nd" data-fid="' + f.id + '" ') + 'title="' + ndTitle + '" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:' + ndCursor + ';color:' + ndColor + '">' +
        ic(ndIcon, 20, ndIconColor) + 'Nothing to disclose</div>' +
      '<button ' + (addDisabled ? 'disabled' : 'data-action="add" data-fid="' + f.id + '"') + ' class="pa-btn pa-btn--primary pa-btn--sm">' + ic('plus', 15, '#fff') + 'Add a financial relationship</button>' +
    '</div>';

    if (editorHere) html += editorHtml();

    var editingId = (editorHere && state.editor.discId) ? state.editor.discId : null;
    var cards = f.disclosures.filter(function (d) { return d.id !== editingId; });

    if (!f.nd && cards.length) {
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        cards.map(function (d) { return cardHtml(f, d); }).join('') + '</div>';
    }
    if (!f.nd && f.disclosures.length === 0 && !editorHere) {
      html += '<div style="font-size:13px;color:#9e9e9e;padding:8px 0">No financial relationships added yet. Add one, or mark nothing to disclose.</div>';
    }
    if (f.nd) {
      html += '<div style="display:flex;align-items:center;gap:10px;padding:14px;background:#eef5fc;border-radius:8px;color:#1147A1;font-size:13px">' +
        ic('check-decagram', 20, '#1147A1') + 'This faculty member has indicated they have nothing to disclose.</div>';
    }
    return html;
  }

  function rowHtml(f) {
    var status = f.nd ? 'nd' : (f.disclosures.length ? 'done' : 'empty');
    var n = f.disclosures.length;
    var pill = status === 'nd' ? { t: 'Nothing to disclose', bg: '#eef5fc', c: '#1976D2' }
      : status === 'done' ? { t: n + (n === 1 ? ' company' : ' companies'), bg: '#e8f5e9', c: '#2e7d32' }
      : { t: 'Not started', bg: '#fff4e5', c: '#e98f28' };
    var expanded = f.id === state.open;
    var updated = f.updated ? ('Updated ' + f.updated) : 'Not yet updated';
    var headBg = expanded ? '#eef5fc' : '#fff';

    return '<div style="border:1px solid #e6e6e6;border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:var(--pa-elev-1)">' +
      '<div data-action="toggle-row" data-fid="' + f.id + '" style="display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;background:' + headBg + '">' +
        '<span style="width:42px;height:42px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:500;background:' + f.color + '">' + esc(f.initials) + '</span>' +
        '<div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:500;color:#1147A1">' + esc(f.name) + '</div>' +
          (f.role ? '<span style="display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:9px;background:#e0e0e0;color:#424242;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px">' + esc(f.role) + '</span>' : '') +
        '</div>' +
        '<div style="display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;font-size:11px;font-weight:600;background:' + pill.bg + ';color:' + pill.c + '">' + pill.t + '</div>' +
        '<div style="font-size:11px;color:#9e9e9e;width:160px;text-align:right">' + updated + '</div>' +
        ic(expanded ? 'chevron-up' : 'chevron-down', 22, '#666') +
      '</div>' +
      (expanded ? '<div style="padding:16px 18px 18px;border-top:1px solid #eee">' + rowBodyHtml(f) + '</div>' : '') +
    '</div>';
  }

  function refreshSuggest() {
    var wrap = document.getElementById('ed-suggest');
    if (!wrap || !state.editor) return;
    var list = state.editor.showSuggest ? suggest(state.editor.company) : [];
    if (!list.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<div style="position:absolute;left:0;right:0;top:62px;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.16);z-index:20;max-height:200px;overflow:auto">' +
      list.map(function (nm) { return '<div class="suggest-item" data-name="' + esc(nm) + '" style="padding:9px 14px;font-size:13px;cursor:pointer;color:#212121">' + esc(nm) + '</div>'; }).join('') +
    '</div>';
    Array.prototype.forEach.call(wrap.querySelectorAll('.suggest-item'), function (el) {
      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        state.editor.company = el.getAttribute('data-name');
        state.editor.showSuggest = false;
        var inp = document.getElementById('ed-company');
        if (inp) inp.value = state.editor.company;
        refreshSuggest();
        refreshSave();
      });
    });
  }
  function refreshSave() {
    var b = document.getElementById('ed-save');
    if (b) b.disabled = editorInvalid();
  }
  function wireEditor() {
    var inp = document.getElementById('ed-company');
    if (inp) {
      inp.addEventListener('input', function (e) { state.editor.company = e.target.value; state.editor.showSuggest = true; refreshSuggest(); refreshSave(); });
      inp.addEventListener('focus', function () { state.editor.showSuggest = true; refreshSuggest(); });
      inp.addEventListener('blur', function () { setTimeout(function () { if (state.editor) { state.editor.showSuggest = false; refreshSuggest(); } }, 160); });
    }
    var ot = document.getElementById('ed-other');
    if (ot) ot.addEventListener('input', function (e) { state.editor.otherText = e.target.value; refreshSave(); });
  }

  function render() {
    document.getElementById('acc-list').innerHTML = state.faculty.map(rowHtml).join('');
    var entered = state.faculty.filter(function (f) { return f.nd || f.disclosures.length; }).length;
    var summary = entered + ' of ' + state.faculty.length + ' faculty complete';
    document.getElementById('sum-header').textContent = 'MPN Congress 2026 · ' + summary;
    document.getElementById('sum-footer').textContent = summary;
    if (state.editor) wireEditor();
  }

  // ---------- Event delegation ----------
  document.getElementById('acc-list').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    var fid = el.getAttribute('data-fid');
    var did = el.getAttribute('data-did');
    var key = el.getAttribute('data-key');
    switch (a) {
      case 'toggle-row': state.open = (state.open === fid ? null : fid); render(); break;
      case 'nd': toggleNd(fid); break;
      case 'add': openEditor(fid, null); break;
      case 'close-editor': state.editor = null; render(); break;
      case 'editor-type': editorToggle(key); break;
      case 'save-editor': saveEditor(); break;
      case 'edit-card': openEditor(fid, did); break;
      case 'del-card': state.confirmDel = { facultyId: fid, discId: did }; render(); break;
      case 'cancel-del': state.confirmDel = null; render(); break;
      case 'do-del': confirmDelete(); break;
    }
  });

  render();
})();
</script>
</body>
</html>
